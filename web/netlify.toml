[build]
  command = "npm test && npm run build"   # a failing test stops the deploy (26 Nov 2026)
  publish = "dist"
[build.environment]
  NODE_VERSION = "20"

# The app lives at /app (the homepage is /). Serve the single-page app for those paths.
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Google sign-in comes back here (the address registered in Google Cloud), and Netlify passes it to the
# Supabase 'google' function, so Google only ever sees our own domain (needed for Google's app review).
[[redirects]]
  from = "/google/callback"
  to = "https://jrdxeagnmunmatxtgmpk.supabase.co/functions/v1/google"
  status = 200
  force = true

# A printed receipt's QR opens /r/<secret code> (ReceiptCheck.tsx). Never indexed by search engines.
[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/r/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# The service worker must never be cached, or phones keep running an old one after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Security headers for every page (21 Nov 2026).
# - frame-ancestors / X-Frame-Options: no other site may show itaOS inside a frame (stops click-tricks).
# - HSTS: browsers always use HTTPS for itaos.app.
# - nosniff, Referrer-Policy, Permissions-Policy: standard hardening; camera/mic/location are off
#   because itaOS doesn't use them.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
    # Full policy in report-only mode first (26 Nov 2026): the browser console lists anything it would block, but
    # nothing is blocked. Once a week of normal use (incl. Facebook connect, receipts, voice notes) shows no
    # reports, move these rules into the Content-Security-Policy line above.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://jrdxeagnmunmatxtgmpk.supabase.co wss://jrdxeagnmunmatxtgmpk.supabase.co https://*.facebook.com https://graph.facebook.com; frame-src https://*.facebook.com; worker-src 'self'; manifest-src 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
