  <style>
    /* itaOS preloader: inline so it shows before the app's JS and CSS arrive.
       The first screen a visitor sees (homepage, or the first load of a visit) shows the liquid ita. loader;
       later loads inside the app pick one of 17 logo animations at random (script below the div). */
    #preloader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0d0e10; transition: opacity .45s ease, visibility .45s ease;
      --t-bg:#131a2a; --t-fg:#ffffff; --t-dot:#f5c84c; --t-edge:#2a3247; --sheen:#ffffff; --ease:cubic-bezier(.22,1,.36,1); }
    :root[data-theme="light"] #preloader { background: #eceef2; --t-bg:#ffffff; --t-fg:#131a2a; --t-edge:#e6e8ec; --sheen:#f5c84c; }
    #preloader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    /* Liquid loaders (engine in the first script of <body>): first screen + Kito thinking */
    .lq-svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #preloader { --lq-ink:#ffffff; --lq-dot:#f5c84c; }
    :root[data-theme="light"] #preloader { --lq-ink:#131a2a; }
    #preloader .pl-liquid { width: min(340px, 72vw); aspect-ratio: 4 / 3; }
    #preloader .pl-stage { display: grid; place-items: center; }
    #preloader .mark { width: 112px; height: 112px; overflow: visible; display: block; }
    #preloader .deck { width: 112px; height: 112px; }
    #preloader .mark {width:96px; height:96px; overflow:visible; display:block; }
    #preloader .mark .tile {fill:var(--t-bg); stroke:var(--t-edge); stroke-width:16; }
    #preloader .mark .l {fill:var(--t-fg); }
    #preloader .mark .dot {fill:var(--t-dot); }
    #preloader .mark .fx {fill:none; }
    #preloader .mark stop {stop-color:var(--sheen); }
    #preloader .mark * {transform-box:fill-box; transform-origin:center; }
    /* 1 · Hop — the dot bounces like the old loader and squashes on landing */
    #preloader .a1 .dot {transform-origin:50% 100%; animation:pl-a1 1.1s infinite; }
    @keyframes pl-a1 {0%   { transform:translateY(0) scale(1.18,.82); animation-timing-function:cubic-bezier(.2,.7,.4,1); }
    12%  { transform:translateY(0) scale(.9,1.12); animation-timing-function:cubic-bezier(.2,.7,.4,1); }
    48%  { transform:translateY(-150px) scale(1); animation-timing-function:cubic-bezier(.6,0,.8,.3); }
    88%  { transform:translateY(0) scale(1,1); }
    100% { transform:translateY(0) scale(1.18,.82); } }
    /* 2 · Rise — i, t, a lift in one by one, the dot pops, then it all clears and repeats */
    #preloader .a2 .l, #preloader .a2 .dot {animation:pl-a2 2.6s var(--ease) infinite both; }
    #preloader .a2 .lt {animation-delay:.09s; }
    #preloader .a2 .la {animation-delay:.18s; }
    #preloader .a2 .dot {animation-name:pl-a2dot; animation-delay:.32s; animation-timing-function:cubic-bezier(.34,1.8,.64,1); }

    @keyframes pl-a2dot {0%{ transform:scale(0) } 18%,72%{ transform:scale(1) } 86%,100%{ transform:scale(0) } }
    /* 3 · Breathe — the tile breathes and sends out a soft yellow ring */
    #preloader .a3 .tilegrp {animation:pl-a3 1.8s ease-in-out infinite; }
    #preloader .a3 .halo {stroke:var(--t-dot); stroke-width:14; animation:pl-a3ring 1.8s ease-out infinite; }
    @keyframes pl-a3 {0%,100%{ transform:scale(1) } 50%{ transform:scale(.93) } }
    @keyframes pl-a3ring {0%{ transform:scale(.95); opacity:.0 } 45%{ opacity:.7 } 100%{ transform:scale(1.32); opacity:0 } }
    /* 4 · Orbit — the dot circles the word and lands back in place */
    /* 5 · Sheen — a light sweep glides across the tile */
    #preloader .a5 .sheen {animation:pl-a5 1.9s cubic-bezier(.45,0,.2,1) infinite; transform-box:view-box; transform-origin:0 0; }
    #preloader .a5 .dot {animation:pl-a5dot 1.9s ease-in-out infinite; }

    @keyframes pl-a5dot {0%,40%,100%{ transform:scale(1) } 52%{ transform:scale(1.22) } }

    @keyframes pl-a12b {0%{opacity:0} 40%{opacity:1;transform:translate(40px,-6px)} 42%{transform:translate(-34px,10px)} 44%{transform:translate(22px,0)} 46%{transform:translate(-40px,-6px)} 48%{opacity:0;transform:none} 78%{opacity:1;transform:translate(-36px,4px)} 80%{transform:translate(28px,-8px)} 82%{opacity:0;transform:none} 100%{opacity:0} }
    @keyframes pl-a12m {0%{transform:none} 40%{transform:translate(8px,0) skewX(-8deg)} 42%{transform:translate(-10px,0)} 44%{transform:skewX(10deg)} 46%{transform:translate(6px,0)} 48%{transform:none} 78%{transform:translate(-8px,0) skewX(6deg)} 82%{transform:none} 100%{transform:none} }
    /* 13 · Typewriter — i, t, a get typed behind a yellow caret that turns into the dot */
    #preloader .a13 .li {animation:pl-a13i 3.2s steps(1,end) infinite; }

    #preloader .a13 .dot {animation:pl-a13dot 3.2s infinite; }
    @keyframes pl-a13i {0%{opacity:0} 15%{opacity:1} 86%{opacity:0} 100%{opacity:0} }
    @keyframes pl-a13t {0%{opacity:0} 27%{opacity:1} 86%{opacity:0} 100%{opacity:0} }
    @keyframes pl-a13a {0%{opacity:0} 39%{opacity:1} 86%{opacity:0} 100%{opacity:0} }
    @keyframes pl-a13c {0%{transform:translateX(0);opacity:1} 15%{transform:translateX(88px)} 27%{transform:translateX(233px)} 39%{transform:translateX(433px)} 52%{opacity:0} 92%{transform:translateX(0);opacity:1} 100%{transform:translateX(0);opacity:1} }
    @keyframes pl-a13b {0%{opacity:1} 50%{opacity:0} }
    @keyframes pl-a13dot {0%,51%{transform:scale(0)} 56%{transform:scale(1.35)} 61%,84%{transform:scale(1)} 88%,100%{transform:scale(0)} }
    /* 14 · Liquid — yellow fills the tile like water with a moving wave */
    #preloader .a14 .rise {animation:pl-a14r 3.4s cubic-bezier(.45,0,.3,1) infinite; }
    #preloader .a14 .wave {animation:pl-a14w 1.3s linear infinite; }
    @keyframes pl-a14r {0%{transform:translateY(1080px)} 58%,78%{transform:translateY(70px)} 100%{transform:translateY(1080px)} }

    @keyframes pl-a15a {0%{transform:translate(-360px,-46px)} 8%{transform:translate(-360px,-140px)} 16%{transform:translate(-360px,-46px)} 24%{transform:translate(-360px,-140px)} 32%{transform:translate(-360px,-46px)} 48%,86%{transform:translate(0,0)} 100%{transform:translate(-360px,-46px)} }
    @keyframes pl-a15b {0%,4%{transform:translate(-200px,-46px)} 12%{transform:translate(-200px,-140px)} 20%{transform:translate(-200px,-46px)} 28%{transform:translate(-200px,-140px)} 36%{transform:translate(-200px,-46px)} 50%,86%{transform:translate(0,0)} 100%{transform:translate(-200px,-46px)} }
    @keyframes pl-a15c {0%,8%{transform:translate(-40px,-46px)} 16%{transform:translate(-40px,-140px)} 24%{transform:translate(-40px,-46px)} 32%{transform:translate(-40px,-140px)} 40%{transform:translate(-40px,-46px)} 52%,86%{transform:translate(0,0)} 100%{transform:translate(-40px,-46px)} }
    @keyframes pl-a15w {0%,50%{opacity:0;transform:translateY(30px)} 60%,84%{opacity:1;transform:none} 94%,100%{opacity:0} }

    #preloader .a17 .q {animation:3s var(--ease) infinite; }

    #preloader .a17 .q2 {animation-name:pl-a17b }

    /* 18 · Shuffle — three colour cards shuffle like a deck */
    #preloader .deck {position:relative; width:96px; height:96px; }

    @keyframes pl-a18 {0%,22%{ transform:none; z-index:3; opacity:1 }

    38%,58%{ transform:translateY(-24%) scale(.8); z-index:1; opacity:.5 }
    64%,88%{ transform:translateY(-12%) scale(.9); z-index:2; opacity:.8 }
    100%{ transform:none; z-index:3; opacity:1 } }
    /* 19 · Jelly — the whole tile squishes and wobbles like jelly */
    #preloader .a19 .mark {transform-origin:50% 100%; animation:pl-a19 1.7s infinite; }
    #preloader .a19 .dot {animation:pl-a19dot 1.7s infinite; }
    @keyframes pl-a19 {0%{transform:none} 10%{transform:scale(1.16,.84)} 24%{transform:translateY(-16%) scale(.88,1.14)} 38%{transform:scale(1.08,.92)} 48%{transform:scale(.96,1.04)} 58%,100%{transform:none} }
    @keyframes pl-a19dot {0%,20%{transform:none} 34%{transform:translateY(-120px)} 46%{transform:none} 52%{transform:scale(1.2,.8)} 60%,100%{transform:none} }
    /* 04 Orbit kick (A: colour passes on) and 21 (B: dots swap places). Both dots sit on one circle (centre 439,548, r 276). */
    #preloader { --pl-dur:3.4s; }
